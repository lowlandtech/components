<!DOCTYPE html>

<head>
    <meta charset="utf-8" />

    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/LowlandTech.Components/css/components.css" />
    <link rel="stylesheet" href="_content/LowlandTech.Components/LowlandTech.Components.styles.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/LowlandTech.Components.Stories/css/stories.css" />
    <link rel="stylesheet" href="_content/LowlandTech.Components.Stories/css/sonner.css" />
    <link rel="stylesheet" href="_content/LowlandTech.Components.Stories/css/rtl.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LowlandTech.Components.App.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        (function() {
            function applyTheme() {
                var stored = localStorage.getItem('app-theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
                document.documentElement.classList.toggle('dark', isDark);
            }

            window.toggleTheme = function() {
                var isDark = document.documentElement.classList.contains('dark');
                var value = isDark ? 'light' : 'dark';
                localStorage.setItem('app-theme', value);
                document.documentElement.classList.toggle('dark', !isDark);
            };

            window.getTheme = function() {
                return document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            };

            window.scrollActiveNavItemIntoView = function() {
                document.querySelector('[data-active="true"]')
                    ?.scrollIntoView({ block: 'nearest' });
            };

            applyTheme();
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
